[workspace]
channels = ["conda-forge", "bioconda"]
name = "ambient-py"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "python check_cleaning.py"
export-env = "pixi workspace export conda-environment --environment default ../ambient-plan/envs/py_cleaning.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' ../ambient-plan/envs/py_cleaning.yml"

[feature.cellbender.tasks]
check = "python check_cellbender.py"
export-env = "pixi workspace export conda-environment --environment cellbender ../ambient-plan/envs/cellbender.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' ../ambient-plan/envs/cellbender.yml"

[feature.cleaning.dependencies]
python = ">=3.10"
scar = "*"
scanpy = "*"
h5py = "*"
# CellClear is pip-only with exact pins (scanpy==1.9.3, anndata==0.8.0, ...):
# it has its own env, ambient-plan envs/cellclear.yml (hand-written for now).

[feature.cellbender.dependencies]
cellbender = "*"
scanpy = "*"

[environments]
default = { features = ["cleaning"], solve-group = "default" }
cellbender = { features = ["cellbender"], solve-group = "cellbender" }
